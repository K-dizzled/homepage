<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: " en " }}">

{%- include head.html -%}

<body>
    {%- include header.html -%}
    <main>
        <div class="content">
             {{ content }}
             {%- if site.commentbox_id -%}  
                    {%- if page.commentbox -%}
                        <div class="commentbox"></div>
                    {%- endif -%}
             {%- endif -%}
        </div>
    </main>
    {%- include footer.html -%}
    
    {%- include linkwrapping.html -%}

    <script>
        // Email links reveal + copy the address instead of opening a mail client
        $('a[href^="mailto:"]').on('click', function (e) {
            e.preventDefault();
            var a = $(this), email = this.href.slice(7);
            if (navigator.clipboard) navigator.clipboard.writeText(email);
            a.text('{' + email + ' · copied}');
            setTimeout(function () { a.text('{' + email + '}'); }, 1500);
        });
    </script>
    
    <!--  Lightbox Javascript -->
    {%- if page.lightbox -%}
    <script>
        lightbox.option({
            'fitImagesInViewport': true,
            'wrapAround': true,
            'alwaysShowNavOnTouchDevices': true,
            'FadeDuration': 2000,
            'imageFadeDuration': 200,
            'resizeDuration': 500
        })
    </script> 
    {%- endif -%}
    </body>
</html>
